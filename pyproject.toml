[project]
name = "dataenginex-website"
version = "0.1.0"
description = "thedataenginex.org marketing site"
requires-python = ">=3.13"
dependencies = [
    "pelican[markdown]>=4.10",
    "pelican-sitemap>=1.0",
    "Pygments>=2.18",
]

[tool.poe.tasks]
dev = "pelican --autoreload --listen --port 8080 content -s pelicanconf.py"
build = "pelican content -o output -s publishconf.py"
clean = { shell = "rm -rf output" }
serve = { shell = "cd output && python -m http.server 8080" }

[tool.uv]
dev-dependencies = [
    "poethepoet>=0.31",
]
