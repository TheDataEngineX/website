name: Deploy to Cloudflare Pages

permissions:
  contents: read
  deployments: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Build site
        run: PYTHONPATH=. uv run poe build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-output
          path: output/
          retention-days: 1

  deploy-production:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      contains(fromJson('["push","workflow_dispatch"]'), github.event_name)
    environment:
      name: production
      url: https://thedataenginex.org
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-output
          path: output/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: thedataenginex-org
          directory: output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-preview:
    name: Deploy PR preview
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment:
      name: preview
    permissions:
      deployments: write
      pull-requests: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-output
          path: output/

      - name: Deploy PR preview to Cloudflare Pages
        id: pages-preview
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: thedataenginex-org
          directory: output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.pages-preview.outputs.url }}';
            const body = `### Preview deployed\n\n**URL:** ${url}\n\nThis preview will be updated on each push to this PR.`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
